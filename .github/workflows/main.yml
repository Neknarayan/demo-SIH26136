name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend: Lint + Tests ─────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check .

      - name: Run tests
        # Provide minimal env vars so Settings() can load without a real .env file
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: ci-test-secret-must-be-at-least-32-chars
          APP_ENV: test
        run: |
          cd backend
          python -m pytest --tb=short -q

  # ── Frontend: TypeScript + Build ──────────────────────────────────────────
  frontend:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript check + build
        # Provide VITE_API_URL so the build doesn't use empty string
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm run build

  # ── Docker: Build images (verify Dockerfiles work) ────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on push to main (not on every PR to save minutes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t procurebridge-backend:ci

      - name: Build frontend image
        run: |
          docker build ./frontend \
            --build-arg VITE_API_URL=/api \
            -t procurebridge-frontend:ci
