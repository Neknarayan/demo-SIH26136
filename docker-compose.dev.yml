# docker-compose.dev.yml — LOCAL DEVELOPMENT
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# This only starts the PostgreSQL database.
# Backend and frontend run locally (hot-reload dev mode).

version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
